# Modified for Local Audio Zones; upstream attribution is in NOTICE.
name: Local Audio Zones
version: "0.1.2"
slug: local_audio_zones
url: https://github.com/alphasixtyfive/local-audio-zones
description: Turn soundcard outputs into separate Music Assistant rooms.
arch:
  - amd64
  - aarch64
# First release; experimental while broader hardware testing continues.
stage: experimental
# Advertise before Home Assistant and Music Assistant start.
startup: services
# s6-overlay owns process supervision.
init: false
# mDNS and inbound Sendspin connections use the host network.
host_network: true
# Use the Home Assistant OS PulseAudio server.
audio: true
# Expose serial devices; relay commands use only explicitly selected ports.
uart: true
options:
  zones: []
  usb_relays: []
# Optional room values inherit app settings; unset app values use CLI defaults.
schema:
  log_level: list(debug|info|warning|error)?
  server: str?
  buffer_ms: int(10,2000)?
  hook_start: str?
  hook_stop: str?
  usb_relays:
    - name: str
      device: device(subsystem=tty)
      protocol: list(DSD TECH SH-UR01A|KMtronic|LCUS)
      channel: int(1,8)?
      zones:
        - str
      off_delay: int(0,)?
  zones:
    - name: str
      device: device(subsystem=sound)?
      channel_pair: list(Front left/right|Rear left/right|Side left/right|Centre/Subwoofer)?
      channels: str?
      id: str
      output: str?
      port: int(1024,65535)?
      log_level: list(debug|info|warning|error)?
      server: str?
      buffer_ms: int(10,2000)?
      hook_start: str?
      hook_stop: str?
