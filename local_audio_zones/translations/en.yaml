configuration:
  zones:
    name: Rooms
    description: Add one player per stereo output. Save and restart to apply changes.
    fields:
      id:
        name: Player ID
        description: Keep this ID when renaming the room, for example sendspin-study.
      name:
        name: Room name
      device:
        name: Soundcard device
        description: Choose a soundcard control or playback device. Prefer /dev/snd/by-id/ when available.
      channel_pair:
        name: Output pair
        description: >-
          Defaults to front. The app checks the pair against the card's active channels.
      output:
        name: Explicit output (advanced)
        description: >-
          Alternative to Sound device. Use a native player output such as
          pulse:my_stereo_sink. Leave Soundcard device and Output pair unset.
      port:
        name: Listen port
        description: Must be unique; defaults to 8928 plus the room position.
      log_level:
        name: Log level
        description: Inherits the app log level when omitted.
      server:
        name: Music Assistant server
        description: Inherits the app setting; an empty value restores player discovery.
      buffer_ms:
        name: Audio buffer
        description: Inherits the app setting; leave unset unless needed, 10 to 2000 ms.
      hook_start:
        name: Playback start command
        description: Inherits the app command; an empty value disables it for this room.
      hook_stop:
        name: Playback stop command
        description: Inherits the app command; an empty value disables it for this room.
  log_level:
    name: Log level
    description: Defaults to info for all rooms.
  server:
    name: Music Assistant server
    description: >-
      Leave unset for player discovery, or use mdns:<name> for a specific server.
  buffer_ms:
    name: Audio buffer
    description: >-
      Leave unset for the native default; accepts 10 to 2000 milliseconds.
  hook_start:
    name: Playback start command
    description: >-
      Optional shell command run inside the app when a stream starts, without
      blocking playback. Commands run as root within the app's confinement.
  hook_stop:
    name: Playback stop command
    description: Optional shell command run inside the app when a stream stops.
